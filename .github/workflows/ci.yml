name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: PYTHONWARNINGS=error uv run pytest -m "not live" -W error --cov=ryuumonbuchi --cov-branch --cov-report=term-missing --cov-fail-under=100
      - run: uv run python -c 'import shutil; from pathlib import Path; shutil.rmtree("dist", ignore_errors=True); Path("dist").mkdir()'
      - run: uv build --no-sources
      - run: uv run python -m ryuumonbuchi --version
      - run: bash -c 'shopt -s nullglob; wheels=(dist/ryuumonbuchi-*.whl); (( ${#wheels[@]} == 1 )); uvx --from "${wheels[0]}" ryuumonbuchi --version'
