name: Live Ghidra verification

on:
  workflow_dispatch:
    inputs:
      ghidra_install_dir:
        description: Existing Ghidra installation path on the runner
        required: true
        default: /usr/share/ghidra

jobs:
  live:
    runs-on: [self-hosted, linux, x64, ghidra]
    env:
      GHIDRA_INSTALL_DIR: ${{ inputs.ghidra_install_dir }}
      RYUUMONBUCHI_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: test -d "$GHIDRA_INSTALL_DIR"
      - run: java -version
      - run: cc --version
      - run: uv run python -c 'from ryuumonbuchi.config import build_config, validate_config; validate_config(build_config())'
      - run: PYTHONWARNINGS=error uv run pytest -m live -W error -q
