name: Live Ghidra verification

on:
  workflow_dispatch:
    inputs:
      ghidra_install_dir:
        description: Existing Ghidra installation path on the runner
        required: true
        default: /usr/share/ghidra

jobs:
  live:
    runs-on: ubuntu-24.04
    env:
      GHIDRA_INSTALL_DIR: ${{ inputs.ghidra_install_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run pytest -m live -q
