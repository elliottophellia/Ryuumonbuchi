name: Build and Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]

permissions: {}

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Verify version consistency
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PROJECT_VERSION="$(uv version --short)"
          test "$PROJECT_VERSION" = "$TAG_VERSION"
          ACTUAL_VERSION="$(uv run ryuumonbuchi --version)"
          test "$ACTUAL_VERSION" = "$TAG_VERSION"
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Run contract tests
        run: uv run pytest -m "not live and not live_server" --cov=ryuumonbuchi --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify distribution metadata
        run: |
          uv run python - <<'PY'
          import email.parser
          import os
          import tarfile
          import zipfile

          version = os.environ["TAG_VERSION"]
          wheel = f"dist/ryuumonbuchi-{version}-py3-none-any.whl"
          sdist = f"dist/ryuumonbuchi-{version}.tar.gz"

          wheel_members = zipfile.ZipFile(wheel).namelist()
          meta_name = next(n for n in wheel_members if n.endswith(".dist-info/METADATA"))
          wheel_meta = zipfile.ZipFile(wheel).read(meta_name)

          with tarfile.open(sdist) as tf:
              pkg_info_name = next(n for n in tf.getnames() if n.endswith("/PKG-INFO"))
              sdist_meta = tf.extractfile(pkg_info_name).read()

          banner = f"https://cdn.rei.my.id/images/Ryuumonbuchi.png?v={version}"
          for raw in (wheel_meta, sdist_meta):
              msg = email.parser.Parser().parsestr(raw.decode("utf-8"))
              assert msg["Name"] == "ryuumonbuchi", msg["Name"]
              assert msg["Version"] == version, msg["Version"]
              classifiers = msg.get_all("Classifier", [])
              assert classifiers.count("Development Status :: 5 - Production/Stable") == 1, classifiers
              assert not any("Alpha" in c for c in classifiers), classifiers
              body = msg.get_payload()
              assert banner in body
              assert "uvx ryuumonbuchi" in body
              assert "uvx --from git+https://github.com/elliottophellia/Ryuumonbuchi@main ryuumonbuchi" in body
          PY

      - name: Smoke test artifacts
        env:
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          test "$(uv run --isolated --no-project --with "dist/ryuumonbuchi-${TAG_VERSION}-py3-none-any.whl" ryuumonbuchi --version)" = "${TAG_VERSION}"
          test "$(uv run --isolated --no-project --with "dist/ryuumonbuchi-${TAG_VERSION}.tar.gz" ryuumonbuchi --version)" = "${TAG_VERSION}"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Ryuumonbuchi ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true

  publish:
    needs: [build, github-release]
    if: ${{ always() && needs.build.result == 'success' && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Dry-run publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --dry-run --check-url https://pypi.org/simple/ryuumonbuchi/ dist/*

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ryuumonbuchi/ dist/*